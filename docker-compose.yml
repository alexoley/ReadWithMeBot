services:
  mongo:
    image: mongo:4.4
    container_name: readwithme-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build: .
    container_name: readwithme-bot
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # ---- обязательные (задаются в файле .env) ----
      BOT_TOKEN: ${BOT_TOKEN:?Укажите BOT_TOKEN в файле .env}
      BOT_USERNAME: ${BOT_USERNAME:?Укажите BOT_USERNAME в файле .env}
      BOT_CREATORID: ${BOT_CREATORID:?Укажите BOT_CREATORID в файле .env}
      # ---- хранилище книг: local (папка в контейнере) или пусто (Google Drive) ----
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      MONGO_URI: mongodb://${MONGO_USER:-user}:${MONGO_PASSWORD:-password}@mongo:27017/bot?authSource=admin
      # ---- нужны только если SPRING_PROFILES_ACTIVE пустой (Google Drive) ----
      GOOGLE_SERVICE_ACCOUNT_CREDENTIALS: ${GOOGLE_SERVICE_ACCOUNT_CREDENTIALS:-}
      FILE_PARENT_FOLDER_ID: ${FILE_PARENT_FOLDER_ID:-}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - books-data:/app/bookshelf

volumes:
  mongo-data:
  books-data:
